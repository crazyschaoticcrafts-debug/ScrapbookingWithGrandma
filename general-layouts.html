<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>General Layouts</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #e9f7f3;
            margin: 0;
            padding: 20px;
        }

        header {
            background: #2a9d8f;
            color: white;
            padding: 25px;
            text-align: center;
            font-size: 32px;
            font-weight: bold;
        }

        section {
            margin: 30px auto;
            max-width: 900px;
            background: white;
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 0 10px rgba(0,0,0,0.1);
        }

        h2 {
            margin-top: 0;
            font-size: 26px;
        }

        .pdf-link a {
            display: inline-block;
            padding: 12px 18px;
            background: #2a9d8f;
            color: white;
            text-decoration: none;
            border-radius: 8px;
            font-weight: bold;
            margin: 10px 0;
        }

        img {
            width: 100%;
            max-width: 400px;
            border-radius: 10px;
            margin: 10px 0;
        }

        iframe {
            width: 100%;
            max-width: 560px;
            height: 315px;
            border: none;
            border-radius: 10px;
            margin: 10px 0;
        }
    </style>
</head>

<body>

<header>General Layouts</header>

<section>
    <h2>Documents</h2>
    <p class="pdf-link"><a href="pdfs/general-example.pdf">Download Example Document</a></p>
</section>

<section>
    <h2>Sketches</h2>
    <img src="images/general-sketch-example.jpg" alt="General Layout Sketch Example">
</section>

<section>
    <h2>Layout Photos</h2>
    <img src="images/general-layout-example.jpg" alt="General Layout Example">
</section>

<section>
    <h2>Videos</h2>
    <iframe src="https://www.youtube.com/embed/YOURVIDEOID" allowfullscreen></iframe>
</section>

</body>
</html>
